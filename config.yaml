framework:
  name: ShadowVoid
  version: 1.0.0-safe
  safe_mode: true
  debug: false

# Network, persistence, stealth, and destructive operations are disabled.
stealth:
  process_name: null
  hide_from_ps: false
  scrub_history: false
  clear_screen: false
  anti_debug: false
  anti_sandbox: false
  timestomping: false

c2:
  enabled: false
  dga:
    enabled: false
    domains_per_day: 0
    tlds: []
  routing:
    tor: false
    i2p: false
    socks5: ""
  heartbeat:
    interval: 300
    jitter: 0
    kill_switch: 0

modules:
  recon: {enabled: true, path: modules/recon.py}
  exploit: {enabled: true, path: modules/exploit.py}
  auth: {enabled: true, path: modules/auth.py}
  wireless: {enabled: true, path: modules/wireless.py}
  net: {enabled: true, path: modules/net.py}
  web: {enabled: true, path: modules/web.py}
  onion: {enabled: true, path: modules/onion.py}
  post_exploit: {enabled: true, path: modules/post_exploit.py}
  process_injection: {enabled: true, path: modules/process_injection.py}

logging:
  enabled: true
